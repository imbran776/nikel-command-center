<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download — Mining Command FMS Source</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
        background: #0d1116;
        color: #e8ecef;
      }
      .card {
        width: min(440px, 92vw);
        border: 1px solid #2a3036;
        background: #151a1f;
        border-radius: 14px;
        padding: 28px 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0 0 18px;
        color: #8a949c;
        font-size: 13px;
        line-height: 1.5;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 42px;
        border-radius: 8px;
        background: #1adbde;
        color: #0d1116;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
      }
      a.btn:hover {
        background: #4ae5e8;
      }
      .meta {
        margin-top: 14px;
        font-size: 11px;
        color: #5a636c;
        font-family: ui-monospace, monospace;
      }
      a.back {
        display: inline-block;
        margin-top: 16px;
        color: #1adbde;
        font-size: 12px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>MINING COMMAND FMS</h1>
      <p>
        Klik tombol di bawah untuk mengunduh paket source lengkap
        (<strong>React + TypeScript + Tailwind</strong>). File akan masuk ke folder
        <strong>Downloads</strong> browser Anda.
      </p>
      <a class="btn" href="/mining-command-fms-source.zip" download="mining-command-fms-source.zip">
        Download source .zip
      </a>
      <div class="meta">
        mining-command-fms-source.zip<br />
        Extract → npm install → npm run dev
      </div>
      <a class="back" href="/">← Kembali ke dashboard</a>
    </div>
    <script>
      // Auto-start download once when opened with ?auto=1
      if (new URLSearchParams(location.search).get('auto') === '1') {
        const a = document.createElement('a');
        a.href = '/mining-command-fms-source.zip';
        a.download = 'mining-command-fms-source.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
    </script>
  </body>
</html>
